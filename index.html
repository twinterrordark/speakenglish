<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ms. Emma — 3D English Class</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="loader">
      <div class="spinner"></div>
      <p>Ms. Emma sınıfa geliyor…</p>
    </div>

    <header class="brand">
      <span class="dot"></span> Ms. Emma's English Class
    </header>

    <section class="panel" aria-label="Pratik paneli">
      <div class="row settings">
        <label class="field">
          <span class="label-text">Konu</span>
          <select id="scenario" aria-label="Konu"></select>
        </label>
        <label class="field">
          <span class="label-text">Seviye</span>
          <select id="level" aria-label="Seviye"></select>
        </label>
        <button id="btn-start" type="button" class="primary">▶ Başla</button>
        <button id="btn-notebook" type="button" class="icon-btn" title="Kelime defteri" aria-label="Kelime defteri">📒</button>
        <details class="more">
          <summary aria-label="Ayarlar">⚙<span class="label-text"> Ayarlar</span></summary>
          <div class="more-body">
            <label class="field">
              Ses
              <select id="voice"></select>
            </label>
            <label class="field">
              Hız
              <select id="rate">
                <option value="0.8">Yavaş</option>
                <option value="1" selected>Normal</option>
              </select>
            </label>
            <label class="toggle">
              <input id="hands-free" type="checkbox" />
              <span>🎧 Eller serbest: Ms. Emma susunca mikrofon kendiliğinden açılsın</span>
            </label>
            <label class="field key">
              🔑 Kendi Gemini anahtarın (isteğe bağlı)
              <input id="user-key" type="password" autocomplete="off" placeholder="AIza…" />
            </label>
            <p class="hint">
              Anahtar sadece bu tarayıcıda saklanır. Boş bırakırsan sitenin anahtarı kullanılır.
              Ücretsiz anahtar: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>
            </p>
            <p class="hint">Konuşmalar yanıt üretmek için Google Gemini'ye gönderilir.</p>
          </div>
        </details>
      </div>

      <ol id="transcript" class="transcript" aria-live="polite" hidden></ol>
      <p id="status" class="status" role="status"></p>

      <form id="say-form" class="row say">
        <button id="btn-mic" type="button" class="mic" title="Konuş" aria-label="Mikrofonla konuş">🎤</button>
        <input id="sentence" type="text" autocomplete="off" enterkeyhint="send" placeholder="Önce derse başla…" disabled />
        <button id="btn-send" type="submit" class="primary send" disabled aria-label="Gönder">
          <span class="label-text">Gönder</span><span class="icon-only">➤</span>
        </button>
        <button id="btn-history" type="button" class="history" aria-pressed="false" title="Konuşma geçmişi" aria-label="Konuşma geçmişini göster">💬</button>
      </form>
    </section>

    <dialog id="sheet" class="sheet">
      <form method="dialog" class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="icon-btn" aria-label="Kapat">✕</button>
      </form>
      <div id="sheet-body" class="sheet-body"></div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
